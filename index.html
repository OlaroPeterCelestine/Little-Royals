<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>Little Royals Kindergarten and Primary School</title>
    <link rel="icon" type="image/png" href="/little-royals-logo.png" />
    <style>
      /* Quiet boot — white canvas, no “Loading…” flash before Vue mounts */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #ffffff;
      }
      #app {
        min-height: 100vh;
        min-height: 100dvh;
        background: #ffffff;
      }
    </style>
    <script>
      // School desk stays light / white — ignore OS dark preference.
      localStorage.setItem('theme', 'light')
      document.documentElement.dataset.theme = 'light'
      document.documentElement.style.colorScheme = 'light'
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
