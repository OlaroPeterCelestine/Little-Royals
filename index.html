<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Little Royals Kindergarten and Primary School</title>
    <link rel="icon" type="image/png" href="/little-royals-logo.png" />
    <script>
      // Apply the saved light or dark mode before the first paint, so the page
      // doesn't flash. useColorScheme() in the app keeps it in sync after that.
      // Default to light to match the ERPNext Education desk look; Help menu
      // can still switch modes and persist via useColorScheme().
      const scheme = localStorage.getItem('theme') || 'light'
      const dark =
        scheme === 'dark' ||
        (scheme !== 'light' &&
          matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
