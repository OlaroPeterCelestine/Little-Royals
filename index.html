<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>Little Royals Kindergarten and Primary School</title>
    <link rel="icon" type="image/png" href="/little-royals-logo.png" />
    <script>
      // School desk stays light/white — ignore OS dark preference and any
      // previously saved dark theme so the brand UI does not flip.
      localStorage.setItem('theme', 'light')
      document.documentElement.dataset.theme = 'light'
      document.documentElement.style.colorScheme = 'light'
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
